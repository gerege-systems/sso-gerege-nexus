services:
  postgres:
    image: postgres:16-alpine
    container_name: gerege_sso_postgres
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      # Matches .env.example and the Makefile DATABASE_URL default.
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-31Z
    container_name: gerege_sso_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot goose migration runner. Without this the API starts against an
  # empty database and every query fails with "relation does not exist".
  redis:
    image: redis:7-alpine
    # Every other container in this file is gerege_sso_*; this one arrived with
    # the upstream merge still carrying upstream's name, and two stacks on one
    # developer's machine cannot both own it.
    container_name: gerege_sso_dev_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gerege_sso_migrate
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gerege_sso_backend
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/platform_db?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: 8080
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GEMINI_VOICE: ${GEMINI_VOICE:-Kore}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time — passing it only as a
        # runtime env var leaves the bundle pointing at the default URL.
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    container_name: gerege_sso_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
