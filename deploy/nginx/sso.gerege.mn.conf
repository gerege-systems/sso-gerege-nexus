# sso.gerege.mn — this repository's stack.
#
# Upstream ports come from docker-compose.prod.yml and are published on
# loopback only: 3011 frontend, 8095 API.
#
# Install this file BEFORE running certbot. Certbot rewrites it in place: it
# adds the `listen 443 ssl` lines plus a second server block that redirects
# port 80 to https. Do not hand-write those — let certbot own them, otherwise
# renewal stops being able to find its anchors.

# Websocket upgrades must only be requested when the client actually asked for
# one; sending `Connection: upgrade` on every request breaks plain HTTP
# keep-alive. The name is prefixed because this host serves more than one site
# and a second `map $http_upgrade $connection_upgrade` anywhere under
# /etc/nginx would be a duplicate-name error that fails `nginx -t` for all of
# them.
map $http_upgrade $sso_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # nexus.gerege.mn's site file is `listen [::]:80 default_server` with a
    # `_` server_name, so without an explicit IPv6 listener every AAAA request
    # for this host would be answered by the neighbouring deployment.
    listen [::]:80;
    server_name sso.gerege.mn;

    # The e-sign upload takes a 15MB PDF as base64 JSON (~20MB on the wire) and
    # the AI voice endpoints accept 1MiB bodies. Nginx's 1m default 413s all of
    # them before the API ever sees the request.
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # Next.js ships no headers of its own here (there is no next.config),
        # and nginx does not inherit add_header into a location that declares
        # one — so the login page needs them stated right here. The API sets
        # its own set in security.HeadersMiddleware; do not duplicate them onto
        # the /api/, /oauth2/ or /.well-known/ locations below.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sso_connection_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8095/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll is a long poll the API holds open for 25s. The default
        # 60s read timeout covers it, but state it so nobody tightens it blind.
        proxy_read_timeout 90s;
    }

    # The OAuth2 / OIDC provider is mounted at the API's root, not under /api/
    # (server.go: /.well-known/openid-configuration, /.well-known/jwks.json,
    # /oauth2/token|introspect|revoke). SSO_ISSUER is this origin, so discovery
    # advertises these exact paths — routed to the frontend they would 404 and
    # every relying party would fail to verify a token.
    #
    # acme-challenge above is the longer prefix, so certbot keeps winning.
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8095/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:8095/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health, /ready and /metrics are deliberately not proxied — the rollout
    # checks them over loopback on the server itself.
}
