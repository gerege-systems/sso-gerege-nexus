# nexus.gerege.mn — this repository's stack.
#
# Upstream ports come from docker-compose.prod.yml and are published on
# loopback only: 3008 frontend, 8082 API. The host also serves sso.gerege.mn
# from its own vhost, so this block stays scoped to one server_name — never
# `default_server` or a `*.gerege.mn` wildcard, which would swallow that
# neighbour's traffic.
#
# Install this file BEFORE running certbot (deploy/scripts/setup_ssl.sh).
# Certbot rewrites it in place: it adds the `listen 443 ssl` lines plus a
# second server block that redirects port 80 to https. Do not hand-write
# those — let certbot own them, otherwise renewal stops being able to find
# its anchors.
server {
    listen 80;
    server_name nexus.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll is a long poll the API holds open for 25s. The default
        # 60s read timeout covers it, but state it so nobody tightens it blind.
        proxy_read_timeout 90s;
    }
}
