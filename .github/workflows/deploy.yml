name: Deploy to Production (sso.gerege.mn)

# Lint, tests and builds live in ci.yml — this workflow publishes images for an
# already-green commit and rolls them out.
#
# This repository is a fork of open-gerege-mn-erp and shares a host with the
# deployment it was forked from. Nothing here may fall back to a default target.
# Upstream defaulted DEPLOY_HOST and PUBLIC_ORIGIN to openerp.gerege.mn, so a
# secret forgotten here would have rolled this repository out over its
# neighbour's production instead of failing. Both are required now.
#
# Required repository secrets:
#   DEPLOY_SSH_KEY              private key for the deploy user (required)
#   DEPLOY_HOST                 required — no default
#   DEPLOY_USER                 defaults to deploy
#   DEPLOY_PORT                 defaults to 22
#   POSTGRES_PASSWORD           database password on the server
#   SSO_DEFAULT_CLIENT_SECRET   OAuth2 secret for the built-in client
#   GEMINI_API_KEY              Google Gemini API key (AI degrades safely if empty)
#   EID_RP_UUID                 eID Mongolia relying-party UUID
#   EID_RP_SECRET               eID Mongolia relying-party secret
#   ESIGN_TOKEN                 Gerege eSign HSM credential (optional)
#   EID_SIGN_SIGNER_CERT_PEM    server Document-Signer certificate, PEM (optional)
#   EID_SIGN_SIGNER_KEY_PEM     its ECDSA private key, PEM (optional)
#
# Repository variables:
#   PUBLIC_ORIGIN               required — no default
#   DEMO_MODE                   "true" seeds the demo account and mock connectors
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to this commit)"
        required: false

permissions:
  contents: read
  # Without this the GHCR push fails with
  # "denied: installation not allowed to Write the repository".
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # Repository variables, not secrets: the `secrets` context is not available
  # in workflow-level env (or in a job name), which fails workflow validation
  # outright — the run never starts.
  # No fallback. This is baked into the frontend bundle at build time, so a
  # wrong value does not fail — it ships a bundle that calls someone else's API.
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
  # Repository variable (Settings → Variables), not a secret. "true" turns the
  # target into a public demo: seeded demo account plus mock E-ID/DAN/XYP.
  DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
  EID_MOCK_MODE: ${{ vars.EID_MOCK_MODE || 'false' }}
  EID_JIT_TENANT_SLUG: ${{ vars.EID_JIT_TENANT_SLUG || 'demo' }}

jobs:
  build-and-push:
    name: Build & push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: deploy/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase paths; github.repository keeps the owner casing.
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # NEXT_PUBLIC_* is inlined into the client bundle at build time, so
          # the production API URL has to be known here, not at run time.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_ORIGIN }}/api/v1
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Roll out to production
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      # A clone with no deploy key is not configured to roll out at all, which is
      # fine — it skips. But a clone that has the key and is missing the target
      # must stop, not guess: this host also serves openerp.gerege.mn, and the
      # defaults this workflow was forked with pointed there.
      - name: Check deployment secrets
        id: guard
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::warning::DEPLOY_SSH_KEY is not configured — skipping rollout."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "${{ secrets.DEPLOY_HOST }}" ] && missing="$missing DEPLOY_HOST"
          [ -z "${{ env.PUBLIC_ORIGIN }}" ] && missing="$missing PUBLIC_ORIGIN"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to deploy without:$missing. There is no default target — see the header of this file."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Copy compose file to the server
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/sso-gerege-mn-erp

      - name: Pull images, migrate and restart
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SSO_DEFAULT_CLIENT_SECRET: ${{ secrets.SSO_DEFAULT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EID_RP_UUID: ${{ secrets.EID_RP_UUID }}
          EID_RP_SECRET: ${{ secrets.EID_RP_SECRET }}
          EID_BASE_URL: ${{ vars.EID_BASE_URL || 'https://eidmongolia.mn/v3' }}
          # Gerege eSign HSM credential. Left empty the HSM rail reports itself
          # unconfigured and refuses to sign, rather than silently returning the
          # document unchanged as mock mode did.
          ESIGN_TOKEN: ${{ secrets.ESIGN_TOKEN }}
          # Server Document-Signer for the PAdES fallback. Optional: signing
          # works without it, only the stamp-outage fallback does not.
          EID_SIGN_SIGNER_CERT_PEM: ${{ secrets.EID_SIGN_SIGNER_CERT_PEM }}
          EID_SIGN_SIGNER_KEY_PEM: ${{ secrets.EID_SIGN_SIGNER_KEY_PEM }}
          PUBLIC_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
          DEMO_MODE: ${{ env.DEMO_MODE }}
          EID_MOCK_MODE: ${{ env.EID_MOCK_MODE }}
          EID_JIT_TENANT_SLUG: ${{ env.EID_JIT_TENANT_SLUG }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN,REPO,POSTGRES_PASSWORD,SSO_DEFAULT_CLIENT_SECRET,GEMINI_API_KEY,EID_RP_UUID,EID_RP_SECRET,EID_BASE_URL,ESIGN_TOKEN,EID_SIGN_SIGNER_CERT_PEM,EID_SIGN_SIGNER_KEY_PEM,PUBLIC_ORIGIN,DEMO_MODE,EID_MOCK_MODE,EID_JIT_TENANT_SLUG
          script: |
            set -euo pipefail
            APP_DIR=/opt/sso-gerege-mn-erp
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')

            # Written fresh every deploy so the server never drifts from CI.
            umask 077
            cat > .env <<EOF
            IMAGE_BACKEND=ghcr.io/${REPO_LOWER}/backend
            IMAGE_FRONTEND=ghcr.io/${REPO_LOWER}/frontend
            IMAGE_TAG=${IMAGE_TAG}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            SSO_DEFAULT_CLIENT_SECRET=${SSO_DEFAULT_CLIENT_SECRET}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            EID_RP_UUID=${EID_RP_UUID}
            EID_RP_SECRET=${EID_RP_SECRET}
            EID_BASE_URL=${EID_BASE_URL}
            ESIGN_TOKEN=${ESIGN_TOKEN}
            EID_SIGN_SIGNER_CERT_PEM=${EID_SIGN_SIGNER_CERT_PEM}
            EID_SIGN_SIGNER_KEY_PEM=${EID_SIGN_SIGNER_KEY_PEM}
            PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
            DEMO_MODE=${DEMO_MODE}
            EID_MOCK_MODE=${EID_MOCK_MODE}
            EID_JIT_TENANT_SLUG=${EID_JIT_TENANT_SLUG}
            EOF

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            # `up -d` runs the migrate service to completion first, then swaps
            # the API and frontend over.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker logout ghcr.io
            docker image prune -f

      - name: Verify the deployment is healthy
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            # This host runs more than one of these stacks, so the check has to
            # name the port this compose file publishes. Left at 8082 it read
            # openerp's backend and called any rollout healthy, working or not.
            PORT=8095
            # The API is published on loopback only; nginx fronts it publicly.
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT}/health" > /dev/null; then
                echo "backend healthy on ${PORT}"
                curl -fsS "http://127.0.0.1:${PORT}/ready" > /dev/null && echo "database reachable"
                exit 0
              fi
              sleep 5
            done
            echo "::error::backend did not become healthy within 150s"
            docker compose -f /opt/sso-gerege-mn-erp/docker-compose.prod.yml logs --tail=80 backend migrate
            exit 1
